name: Assemble preprint PDF

on:
  push:
    branches: [main]
    paths:
      - '.pdf-b64/**'
      - '.github/workflows/assemble-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PDF
        run: |
          cat .pdf-b64/chunk_* | base64 --decode > Pseudo_Calabi_Yau_Complex_S6_Preprint.pdf
          file Pseudo_Calabi_Yau_Complex_S6_Preprint.pdf
          test -s Pseudo_Calabi_Yau_Complex_S6_Preprint.pdf
          head -c 5 Pseudo_Calabi_Yau_Complex_S6_Preprint.pdf | grep -q '%PDF-'
      - name: Commit PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Pseudo_Calabi_Yau_Complex_S6_Preprint.pdf
          git diff --cached --quiet || git commit -m 'Assemble preprint PDF'
          git push
